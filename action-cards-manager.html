<title>Manager Playbook — Sprint Plan (Action Cards)</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
:root{--void:#080b10;--surface:#0e1219;--surface-2:#141922;--surface-3:#1b2130;
--teal:#1d6aff;--gold:#e8b800;--sky:#38bdf8;--green:#34d399;
--text:#ffffff;--text-2:#c8d0de;--text-3:#7a8799;--border:#1e2636;--border-2:#2a3347;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#05070b;font-family:'Inter',system-ui,sans-serif;color:var(--text);padding:28px 16px;}
.intro{max-width:210mm;margin:0 auto 26px;color:var(--text-2);font-size:14px;line-height:1.5;}
.intro b{color:var(--text);}
.intro .eg{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:8px;}
.card{width:210mm;max-width:100%;margin:0 auto 34px;background:var(--void);border:1px solid var(--border);
border-radius:12px;padding:38px 36px;position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;
background:linear-gradient(90deg,var(--teal) 0%,var(--teal) 70%,var(--gold) 70%,var(--gold) 100%);}
.eyebrowrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);}
.pathbadge{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
color:var(--text-2);border:1px solid var(--border-2);padding:4px 10px;border-radius:4px;}
h1{font-size:31px;font-weight:300;line-height:1.12;margin-bottom:10px;color:var(--text);}
h1 strong{font-weight:600;color:var(--teal);}
.frame{font-size:14.5px;color:var(--text-2);max-width:66ch;margin-bottom:6px;line-height:1.45;}
.stepline{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:22px;}
.day{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--border);}
.day:last-of-type{border-bottom:1px solid var(--border);}
.check{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--teal);border-radius:6px;margin-top:2px;}
.daybody{flex:1;}
.daylabel{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:4px;}
.daylabel .verb{color:var(--text);font-weight:600;}
.action{font-size:15px;font-weight:500;color:var(--text);line-height:1.35;margin-bottom:4px;}
.why{font-size:12.5px;color:var(--text-2);line-height:1.45;}
.why b{color:var(--green);font-weight:600;}
.footer{margin-top:22px;padding:15px 18px;background:var(--surface-3);border-radius:8px;border:1px solid var(--border-2);
display:flex;justify-content:space-between;align-items:center;gap:16px;}
.footer-txt{font-size:13px;color:var(--text-2);line-height:1.45;}
.footer-txt b{color:var(--text);font-weight:600;}
.footer-cta{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
color:var(--void);background:var(--gold);padding:8px 14px;border-radius:6px;white-space:nowrap;font-weight:600;}
.lockup{margin-top:16px;display:flex;justify-content:space-between;align-items:center;}
.brand{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);}
.brand b{color:var(--teal);font-weight:600;}
.pin{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);}
@media print{
 @page{size:A4;margin:0;}
 body{background:#fff;padding:0;color:#080b10;}
 .intro{display:none;}
 .card{background:#fff;border:none;border-radius:0;margin:0;padding:16mm 15mm;page-break-after:always;overflow:visible;}
 .card::before{height:6px;}
 .eyebrow{color:#1d6aff;}
 .pathbadge{color:#5a6578;border-color:#d7dce6;}
 h1{color:#080b10;} h1 strong{color:#1d6aff;}
 .frame{color:#2a3347;}
 .stepline{color:#9a7c08;}
 .day{border-color:#e2e6ee;}
 .check{border-color:#1d6aff;background:#fff;}
 .daylabel{color:#1d6aff;} .daylabel .verb{color:#080b10;}
 .action{color:#080b10;}
 .why{color:#5a6578;} .why b{color:#13865a;}
 .footer{background:#f4f6fa;border-color:#e2e6ee;}
 .footer-txt{color:#2a3347;} .footer-txt b{color:#080b10;}
 .footer-cta{color:#080b10;background:#e8b800;}
 .brand{color:#5a6578;} .brand b{color:#1d6aff;} .pin{color:#5a6578;}
}
.site-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:11px 24px;background:rgba(8,11,16,.94);backdrop-filter:blur(12px);border-bottom:1px solid #1e2636;font-family:'Inter',system-ui,sans-serif;}.sb-back{color:#1d6aff;text-decoration:none;font-size:13px;font-weight:500;}.sb-back:hover{text-decoration:underline;}.sb-sp{margin-left:auto;}.tier-badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px;border:1px solid;white-space:nowrap;line-height:1;}.tier-vip{color:#e8b800;border-color:rgba(232,184,0,.5);background:rgba(232,184,0,.08);}@media print{.site-bar{display:none;}}
