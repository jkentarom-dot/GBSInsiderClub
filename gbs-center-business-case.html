  h += '<h2>Words used in this tool</h2><div class="card"><div class="grid2">' + G.GLOSS.map(function (g) { return '<div style="margin-bottom:8px"><b style="color:var(--text)">' + esc(g[0]) + '.</b> ' + esc(g[1]) + '</div>'; }).join('') + '</div></div>';
  return h;
}

// ---------- PLAIN SUMMARY (top of Results) ----------
function plainSummary() {
  var h = '<div class="card f"><div class="tag">In plain words</div>';
  RS.forEach(function (r, i) {
    var k = r.kpi, st = r.bridge.steps.slice(0, 6).filter(function (s) { return s.v > 0; }).sort(function (a, b) { return b.v - a.v; })[0];
    var ones = r.yearly.filter(function (l) { return l.type === 'one' && ['oneCont', 'oneDep'].indexOf(l.k) < 0; }).map(function (l) { return { label: l.label, v: l.y.reduce(function (a, b) { return a + b; }, 0) }; }).sort(function (a, b) { return b.v - a.v; })[0];
    h += '<div style="padding:10px 0;border-top:1px solid var(--border);border-left:3px solid ' + COL[i] + ';padding-left:14px;margin-top:8px"><b style="color:var(--text)">' + esc(M.scenarios[i].name) + '</b><ul class="t" style="margin-top:4px">' +
      '<li>' + (k.npv >= 0 ? 'Meets your required return of ' + r.P.discount + '%. NPV is ' + eur(k.npv) + '.' : 'Does not meet your required return of ' + r.P.discount + '%. NPV is ' + eur(k.npv) + '.') + ' ' + (k.payback == null ? 'No payback within ' + r.NY + ' years.' : 'Payback after ' + k.payback.toFixed(0) + ' months.') + '</li>' +
      '<li>Once running, it saves ' + eur(k.runRate) + ' per year (' + pct(k.runRatePct, 0) + ' of today\u2019s cost).</li>' +
      '<li>You must fund up to ' + eur(k.peakFunding) + ' before it turns positive (month ' + k.peakMonth + ').</li>' +
      '<li>Largest saving source: ' + (st ? esc(st.label.toLowerCase()) + ' (' + eur(st.v) + ' per year)' : 'none') + '. Largest one-time cost: ' + (ones ? esc(ones.label.toLowerCase()) + ' (' + eur(ones.v) + ')' : 'none') + '.</li></ul></div>';
  });
  return h + '</div>';
}

// ---------- ASSUMPTION SHEET ----------
var asMode = 'ess', IMP = null, impTimer = null;
function isEss(k) { return G.ESS.indexOf(k) >= 0; }
function renderAssumptions() {
  var all = G.REG.length, ess = G.ESS.length;
  var h = '<div class="eyebrow">Assumptions</div><h1>What you can change, and <em>what it does</em></h1><p class="lead">Every line says what the input is and what it changes. Start with the Essentials. Change a value in Base to affect all scenarios, or in A, B or C to affect one scenario only.</p>';
  h += '<div class="card"><div class="grid2"><ul class="t" style="margin:0"><li><b style="color:var(--text)">Base:</b> the value all scenarios use.</li><li><b style="color:var(--text)">A, B, C:</b> optional value for one scenario. Gold means an override is set. Empty means Base is used.</li></ul><ul class="t" style="margin:0"><li><b style="color:var(--text)">Importance:</b> how much NPV moves between the Low and High value. Calculated live for the scenario you pick.</li><li><b style="color:var(--text)">Direction:</b> whether a higher value helps or hurts the result.</li></ul></div></div>';
  h += '<div class="callout">Salaries are market benchmarks. All other defaults are example values. Replace them with your own payroll, lease and legal data before you decide anything.</div>';
  h += '<div class="ctrl"><div><label class="f">Show</label><div style="display:flex;gap:6px"><button class="btn sm ' + (asMode === 'ess' ? '' : 'sec') + '" data-act="as-ess">Essentials (' + ess + ')</button><button class="btn sm ' + (asMode === 'all' ? '' : 'sec') + '" data-act="as-all">All inputs (' + all + ')</button></div></div>' +
    '<div><label class="f">Importance for scenario</label><select data-sel="selSc">' + M.scenarios.map(function (s, i) { return '<option value="' + i + '"' + (i === selSc ? ' selected' : '') + '>' + LBL[i] + ': ' + esc(s.name.replace(/^[A-C]:\s*/, '')) + '</option>'; }).join('') + '</select></div>' +
    '<div style="min-width:240px"><label class="f">Filter</label><input type="text" id="asFilter" placeholder="Type to filter, e.g. severance"></div><div><button class="btn sec sm" data-act="clear-all-ov">Clear all overrides</button></div></div>';
  var groups = []; G.REG.forEach(function (r) { if (groups.indexOf(r.grp) < 0) groups.push(r.grp); });
  var adv = asMode === 'all';
  h += '<div class="card scroll"><table id="asTable"><thead><tr><th>Input and explanation</th><th class="r">Base</th><th>Unit</th><th class="r" style="color:' + COL[0] + '">A</th><th class="r" style="color:' + COL[1] + '">B</th><th class="r" style="color:' + COL[2] + '">C</th><th style="min-width:190px">Importance</th>' + (adv ? '<th class="r">Low</th><th class="r">High</th><th>Conf.</th>' : '') + '</tr></thead><tbody>';
  var ncols = adv ? 10 : 7;
  groups.forEach(function (g) {
    var rows = G.REG.filter(function (r) { return r.grp === g && (adv || isEss(r.k)); });
    if (!rows.length) return;
    h += '<tr class="sec" data-grp="' + esc(g) + '"><td colspan="' + ncols + '">' + esc(g) + ' <span style="text-transform:none;letter-spacing:0;font-family:\'Inter\',system-ui,sans-serif;color:var(--text-3)">\u2014 ' + esc(G.GRPDESC[g] || '') + '</span></td></tr>';
    rows.forEach(function (r) {
      var ex = G.EXPL[r.k] || [r.l, r.t, ''];
      h += '<tr data-k="' + r.k + '" data-txt="' + esc((ex[0] + ' ' + ex[1] + ' ' + r.l).toLowerCase()) + '"><td style="min-width:380px;max-width:560px"><div style="color:var(--text);font-weight:500">' + esc(ex[0]) + '</div><div class="muted" style="font-size:13px;line-height:1.45">' + esc(ex[1]) + '</div><div style="font-size:13px;line-height:1.45;color:var(--text-2)"><span class="mono" style="font-size:12px;color:var(--gold)">EFFECT</span> ' + esc(ex[2]) + (ex[3] ? ' <span class="muted">' + esc(ex[3]) + '</span>' : '') + '</div></td>' +
        '<td style="width:112px"><input type="number" step="any" data-base="' + r.k + '" value="' + M.P[r.k] + '"></td><td class="muted" style="white-space:nowrap">' + esc(r.u) + '</td>';
      for (var i = 0; i < 3; i++) {
        var has = M.scenarios[i].ov && M.scenarios[i].ov[r.k] !== undefined;
        h += '<td style="width:100px"><input class="ov' + (has ? ' set' : '') + '" type="number" step="any" data-ov="' + i + ':' + r.k + '" value="' + (has ? M.scenarios[i].ov[r.k] : '') + '" placeholder="' + (has ? '' : M.P[r.k]) + '"></td>';
      }
      h += '<td data-imp="' + r.k + '"><span class="muted">calculating\u2026</span></td>';
      if (adv) h += '<td style="width:100px"><input type="number" step="any" data-lo="' + r.k + '" value="' + r.lo + '" ' + (r.lo === r.hi ? 'disabled' : '') + '></td><td style="width:100px"><input type="number" step="any" data-hi="' + r.k + '" value="' + r.hi + '" ' + (r.lo === r.hi ? 'disabled' : '') + '></td><td><span class="badge ' + r.c.toLowerCase() + '">' + r.c + '</span></td>';
      h += '</tr>';
    });
  });
  h += '</tbody></table></div>';
  return h;
}
function computeImpact(done) {
  var keys = G.REG.filter(function (r) { return r.lo !== r.hi && (asMode === 'all' || isEss(r.k)); });
  var sc = M.scenarios[selSc], out = {}, i = 0, myVer = ver;
  function step() {
    if (myVer !== ver || tab !== 'assumptions') return;
    var t0 = Date.now();
    while (i < keys.length && Date.now() - t0 < 25) { var r = keys[i++]; var x = G.impactOne(M, sc, r); out[r.k] = { lo: x.lo, hi: x.hi, swing: Math.abs(x.hi - x.lo), dir: x.hi - x.lo }; }
    if (i < keys.length) setTimeout(step, 0); else done(out);
  }
  step();
}
function fillImpact() {
  computeImpact(function (map) {
    var mx = 0; Object.keys(map).forEach(function (k) { mx = Math.max(mx, map[k].swing); });
    $$('[data-imp]').forEach(function (td) {
      var k = td.getAttribute('data-imp'), m = map[k]; if (!m) { td.innerHTML = '<span class="muted">n/a</span>'; return; }
      var rel = mx ? m.swing / mx : 0, lab = rel > 0.5 ? 'Very high' : rel > 0.2 ? 'High' : rel > 0.06 ? 'Medium' : rel > 0.005 ? 'Low' : 'None';
      var dir = m.dir > 1000 ? '<span class="pos">Higher is better</span>' : m.dir < -1000 ? '<span class="neg">Higher is worse</span>' : '<span class="muted">Little effect</span>';
      td.innerHTML = '<div style="display:flex;align-items:center;gap:8px"><span class="bar" style="width:' + Math.round(rel * 70) + 'px;background:var(--teal)"></span><b style="color:var(--text);font-weight:500">' + lab + '</b></div><div style="font-size:12px;color:var(--text-3)">' + (m.swing >= 1000 ? 'NPV swing ' + eur(m.swing, 1) : 'NPV swing under \u20AC1k') + '</div><div style="font-size:12px">' + dir + '</div>';
    });
  });
}
function scheduleImpact() { clearTimeout(impTimer); impTimer = setTimeout(fillImpact, 500); }

var ver = 0;
tab = 'start';
var TABS = [['start', 'Start here'], ['results', 'Results'], ['scenarios', 'Scenarios'], ['assumptions', 'Assumptions'], ['phasing', 'Timeline and people'], ['reverse', 'Reverse plan'], ['sens', 'What matters most'], ['data', 'Countries and salaries'], ['about', 'Method (advanced)']];
var RENDER = { start: renderStart, results: renderResults, scenarios: renderScenarios, assumptions: renderAssumptions, data: renderData, phasing: renderPhasing, reverse: renderReverse, sens: renderSens, about: renderAbout };

function render() {
  TIPS = {};
  var v = $('#view'); v.innerHTML = RENDER[tab]();
  $$('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
  ['cf1', 'hc1', 'rv1'].forEach(function (id) { if (document.getElementById(id)) wireLine(id); });
  if (tab === 'scenarios') updateHints();
  if (tab === 'assumptions') fillImpact();
}
function commit(structural) {
  ver++;
  try { recompute(); } catch (e) { console.error(e); }
  updateStrip();
  if (structural || OUT_TABS.indexOf(tab) >= 0) render();
  save();
  if (tab === 'assumptions') scheduleImpact();
}
function applyRng() { if (M.rng) Object.keys(M.rng).forEach(function (k) { var r = G.REG.filter(function (x) { return x.k === k; })[0]; if (r) { r.lo = M.rng[k][0]; r.hi = M.rng[k][1]; } }); }
function resetRng() { var d = G.defaultModel(); }

function buildShell() {
  document.body.innerHTML =
    '<header class="top"><div class="top-in"><div class="brand"><div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d6aff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></div><div><b>GBS Center Business Case</b><span><a href="/" style="color:inherit;text-decoration:none">GBS Insider Club</a> &middot; free tool</span></div></div>' +
    '<div class="tools"><button class="btn sec sm" data-act="export">Export scenarios</button><button class="btn sec sm" data-act="import">Import</button><button class="btn sec sm" data-act="print">Print</button><button class="btn sec sm danger" data-act="reset">Reset to defaults</button><input type="file" id="file" accept="application/json" style="display:none"></div></div>' +
    '<div class="strip" id="strip"></div><nav class="tabs" id="tabs">' + TABS.map(function (t) { return '<button class="tab" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</nav></header>' +
    '<main id="view"></main><div id="tip"></div>';
}

function setVal(el, raw) {
  var p = el.getAttribute('data-path'), t = el.getAttribute('data-t') || 'n', v;
  if (t === 's') v = raw; else if (t === 'b') v = !!el.checked; else { v = raw === '' ? 0 : parseFloat(raw); if (isNaN(v)) v = 0; if (el.hasAttribute('data-pct')) v = v / 100; }
  setPath(M, p, v);
}
function structuralPath(p) { return /\.cluster$|\.sev\.m$|\.type$|\.firstWave$|\.site$|\.automation$/.test(p) || /^src\.\d+\.c$/.test(p); }

document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.hasAttribute('data-path') && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
    setVal(el, el.value); if (tab === 'scenarios') updateHints(); commit(false);
  } else if (el.hasAttribute('data-base')) {
    var k = el.getAttribute('data-base'); M.P[k] = el.value === '' ? 0 : parseFloat(el.value);
    var row = el.closest('tr'); $$('input.ov', row).forEach(function (o) { if (!o.classList.contains('set')) o.placeholder = M.P[k]; });
    commit(false);
  } else if (el.hasAttribute('data-ov')) {
    var pr = el.getAttribute('data-ov').split(':'), i = +pr[0], key = pr[1];
    M.scenarios[i].ov = M.scenarios[i].ov || {};
    if (el.value === '') { delete M.scenarios[i].ov[key]; el.classList.remove('set'); el.placeholder = M.P[key]; }
    else { M.scenarios[i].ov[key] = parseFloat(el.value); el.classList.add('set'); }
    commit(false);
  } else if (el.hasAttribute('data-lo') || el.hasAttribute('data-hi')) {
    var kk = el.getAttribute('data-lo') || el.getAttribute('data-hi'), isLo = el.hasAttribute('data-lo');
    var r = G.REG.filter(function (x) { return x.k === kk; })[0]; var v = parseFloat(el.value); if (isNaN(v)) return;
    if (isLo) r.lo = v; else r.hi = v; M.rng = M.rng || {}; M.rng[kk] = [r.lo, r.hi]; ver++; save();
  } else if (el.hasAttribute('data-tiers')) {
    var idx = +el.getAttribute('data-tiers'); var tiers = el.value.split(',').map(function (x) { var a = x.split(':'); return [parseFloat(a[0]), parseFloat(a[1])]; }).filter(function (a) { return !isNaN(a[0]) && !isNaN(a[1]); });
    if (tiers.length) { M.clusters[idx].sev.tiers = tiers; commit(false); }
  } else if (el.id === 'rampTxt') {
    var arr = el.value.split(',').map(function (x) { return parseFloat(x); }).filter(function (x) { return !isNaN(x); });
    if (arr.length) { M.ramp = arr; commit(false); }
  } else if (el.id === 'asFilter') {
    var q = el.value.toLowerCase();
    $$('#asTable tbody tr[data-k]').forEach(function (tr) { tr.style.display = (!q || tr.getAttribute('data-txt').indexOf(q) >= 0) ? '' : 'none'; });
    $$('#asTable tr.sec').forEach(function (tr) { var g = tr.getAttribute('data-grp'); var any = $$('#asTable tr[data-k]').some(function (r2) { return r2.style.display !== 'none' && G.REG.filter(function (x) { return x.k === r2.getAttribute('data-k'); })[0].grp === g; }); tr.style.display = any ? '' : 'none'; });
  }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.hasAttribute('data-path') && (el.type === 'checkbox' || el.tagName === 'SELECT')) {
    setVal(el, el.value); commit(structuralPath(el.getAttribute('data-path')));
  } else if (el.hasAttribute('data-sel')) {
    selSc = +el.value; render();
  } else if (el.id === 'gType') { GOAL.type = el.value; GOAL.target = el.value === 'npv' ? 0 : el.value === 'irr' ? 15 : 36; render(); }
  else if (el.id === 'gTarget') { GOAL.target = parseFloat(el.value) || 0; render(); }
  else if (el.id === 'gMax') { GOAL.max = Math.max(50, Math.min(1500, parseFloat(el.value) || 400)); render(); }
  else if (el.id === 'file') {
    var f = el.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () { try { var m = JSON.parse(rd.result); if (!m.P || !m.scenarios || m.scenarios.length !== 3) throw 0; var d = G.defaultModel(); Object.keys(d.P).forEach(function (k) { if (m.P[k] === undefined) m.P[k] = d.P[k]; }); migrateSal(m); M = m; applyRng(); commit(true); } catch (x) { alert('This file is not a valid scenario export.'); } };
    rd.readAsText(f); el.value = '';
  }
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-tab],[data-act]'); if (!b) return;
  if (b.hasAttribute('data-tab')) { tab = b.getAttribute('data-tab'); render(); window.scrollTo(0, 0); return; }
  var a = b.getAttribute('data-act'), i = +b.getAttribute('data-i'), j = +b.getAttribute('data-j'), sc = M.scenarios[i];
  if (a === 'add-site') { sc.sites.push({ name: 'Site ' + (sc.sites.length + 1), cluster: 'CEE', share: 30, firstWave: 0, type: 'lease', rentFree: 3, langPrem: 0, langShare: 0 }); commit(true); }
  else if (a === 'del-site') { sc.sites.splice(j, 1); commit(true); }
  else if (a === 'add-wave') { sc.waves.push({ name: 'Wave ' + (sc.waves.length + 1), share: 10, start: 10, team: 'standard' }); commit(true); }
  else if (a === 'del-wave') { sc.waves.splice(j, 1); sc.sites.forEach(function (s) { if (s.firstWave >= sc.waves.length) s.firstWave = 0; }); commit(true); }
  else if (a === 'add-sub') { sc.subs = sc.subs || []; sc.subs.push({ name: 'New incentive', site: -1, type: 'perJob', amount: 0, delay: 6, cap: 0, prob: 70, months: 12, active: true }); commit(true); }
  else if (a === 'del-sub') { sc.subs.splice(j, 1); commit(true); }
  else if (a === 'clear-ov') { sc.ov = {}; commit(true); }
  else if (a === 'clear-all-ov') { M.scenarios.forEach(function (s) { s.ov = {}; }); commit(true); }
  else if (a === 'add-src') { M.src.push({ c: 'FRBE', share: 20 }); commit(true); }
  else if (a === 'del-src') { M.src.splice(j, 1); commit(true); }
  else if (a === 'copy') { var f = +$('#cpFrom').value, t = +$('#cpTo').value; if (f !== t) { var c = G.clone(M.scenarios[f]); c.name = LBL[t] + ': ' + c.name.replace(/^[A-C]:\s*/, '') + ' (copy)'; M.scenarios[t] = c; commit(true); } }
  else if (a === 'use-bench') { var cid = b.getAttribute('data-c'), bb = G.BENCH_CL[cid]; M.clusters.forEach(function (c) { if (c.id === cid) { c.sal = bb.sal.slice(); c.wg = bb.wg; } }); commit(true); }
  else if (a === 'solve') { RV = null; render(); }
  else if (a === 'as-ess') { asMode = 'ess'; render(); }
  else if (a === 'as-all') { asMode = 'all'; render(); }
  else if (a === 'export') { var blob = new Blob([JSON.stringify(M, null, 1)], { type: 'application/json' }); var u = URL.createObjectURL(blob); var l = document.createElement('a'); l.href = u; l.download = 'gbs-center-business-case.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 500); }
  else if (a === 'import') { $('#file').click(); }
  else if (a === 'print') { window.print(); }
  else if (a === 'reset') { if (confirm('Reset all assumptions and scenarios to the defaults?')) { try { localStorage.removeItem(LSKEY); } catch (x) { } location.reload(); } }
});
document.addEventListener('mousemove', function (e) {
  var t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t) showTip(t.getAttribute('data-tip'), e); else if (!e.target.closest || !e.target.closest('[id$="-hit"]')) hideTip();
});

// boot
(function boot() {
  M = load(); applyRng(); buildShell();
  try { recompute(); } catch (e) { console.error(e); document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f87171;padding:20px">' + esc(e.stack) + '</pre>'); return; }
  updateStrip(); render();
})();

})();
</script></body></html>
