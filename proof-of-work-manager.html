<style>
:root{--void:#080b10;--surface:#0e1219;--surface-2:#141922;--surface-3:#1b2130;
    --teal:#1d6aff;--gold:#e8b800;--green:#34d399;--text:#ffffff;--text-2:#c8d0de;--text-3:#7a8799;
    --border:#1e2636;--border-2:#2a3347;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);font-family:'Inter',system-ui,sans-serif;color:var(--text);}
  .wrap{max-width:880px;margin:0 auto;padding:48px 28px 80px;}
  .top-accent{height:5px;background:linear-gradient(90deg,var(--teal) 0%,var(--teal) 70%,var(--gold) 70%,var(--gold) 100%);}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);}
  h1{font-size:34px;font-weight:300;line-height:1.1;margin:10px 0 14px;}
  h1 strong{font-weight:600;color:var(--teal);}
  .lead{font-size:16px;color:var(--text-2);line-height:1.6;max-width:64ch;margin-bottom:8px;}
  .lead b{color:var(--text);}

  .progress{margin:26px 0 8px;display:flex;align-items:center;gap:14px;}
  .progress .bar{flex:1;height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .3s;}
  .progress .count{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-2);white-space:nowrap;}

  .step{margin-top:34px;}
  .step-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .step-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border-2),transparent);}

  .item{display:flex;gap:16px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;}
  .item:hover{border-color:var(--border-2);}
  .item.done{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.05);}
  .box{flex:0 0 auto;width:24px;height:24px;border:2px solid var(--teal);border-radius:6px;margin-top:2px;
    display:flex;align-items:center;justify-content:center;transition:all .2s;}
  .item.done .box{background:var(--green);border-color:var(--green);}
  .box svg{width:14px;height:14px;opacity:0;transition:opacity .2s;}
  .item.done .box svg{opacity:1;}
  .body .name{font-size:15.5px;font-weight:500;color:var(--text);margin-bottom:3px;}
  .item.done .name{color:var(--text-2);}
  .body .proves{font-size:12.5px;color:var(--text-2);line-height:1.45;}
  .body .proves b{color:var(--green);font-weight:600;}

  .footer{margin-top:40px;padding:20px 22px;background:var(--surface-3);border:1px solid var(--border-2);border-radius:10px;}
  .footer p{font-size:14px;color:var(--text-2);line-height:1.6;}
  .footer p b{color:var(--text);}
  .brand{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text-2);}
  .brand b{color:var(--teal);font-weight:600;}

  @media print{
    body{background:#fff;color:#080b10;}
    .top-accent{height:6px;}
    .eyebrow{color:#1d6aff;} h1 strong{color:#1d6aff;} .lead{color:#2a3347;} .lead b{color:#080b10;}
    .step-label{color:#9a7c08;}
    .item{background:#fff;border-color:#e2e6ee;break-inside:avoid;}
    .box{border-color:#1d6aff;} .name{color:#080b10;} .proves{color:#5a6578;} .proves b{color:#13865a;}
    .progress{display:none;}
    .footer{background:#f4f6fa;border-color:#e2e6ee;} .footer p{color:#2a3347;} .brand{color:#5a6578;}
    @page{margin:14mm;}
  }
.site-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:11px 24px;background:rgba(8,11,16,.94);backdrop-filter:blur(12px);border-bottom:1px solid #1e2636;font-family:'Inter',system-ui,sans-serif;}.sb-back{color:#1d6aff;text-decoration:none;font-size:13px;font-weight:500;}.sb-back:hover{text-decoration:underline;}.sb-sp{margin-left:auto;}.tier-badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px;border:1px solid;white-space:nowrap;line-height:1;}.tier-vip{color:#e8b800;border-color:rgba(232,184,0,.5);background:rgba(232,184,0,.08);}@media print{.site-bar{display:none;}}
</style>
